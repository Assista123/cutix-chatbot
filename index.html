<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutix Assistant (demo)</title>
<style>
:root{--red:#d71920;--red-d:#b5131a;--ink:#111;--bg:#f4f4f5;--card:#fff;--text:#1b1b1d;--muted:#6b6b72;--line:#e3e3e6;--bot:#fff;--user:#d71920;--usertext:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--text:#ececef;--muted:#9a9aa3;--line:#2b2b30;--bot:#242428}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center}
#app{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:3px solid var(--red)}
.badge{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center}
.badge img{height:34px;width:auto;display:block}
.badge span{color:var(--red);font-weight:800;font-size:15px}
header h1{font-size:16px;margin:0;line-height:1.2}
header small{color:#b9b9bf;font-size:12px}
.note{font-size:12px;color:var(--muted);background:var(--card);border-bottom:1px solid var(--line);padding:6px 14px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{max-width:86%;padding:10px 13px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.m p{margin:0 0 6px}.m p:last-child{margin:0}.m ul{margin:4px 0 6px;padding-left:20px}.m a{color:inherit;text-decoration:underline}
.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bot a{color:var(--red)}
.me{background:var(--user);color:var(--usertext);align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.chip{border:1px solid var(--red);color:var(--red);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip:hover{background:var(--red);color:#fff}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.actions{display:flex;gap:8px;padding:8px 14px 0;background:var(--bg)}
.actions a{flex:1;text-align:center;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none}
.actions a.wa{border-color:var(--line);color:var(--muted);opacity:.75}
.actions a.wa.ready{border-color:#1fa855;color:#1fa855;opacity:1;font-weight:700;background:#f0faf4}
form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;max-height:110px}
button.send{background:var(--red);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
button.send:disabled{background:#999;cursor:default}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:0 14px 6px}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
#gate div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:340px}
#gate input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;background:var(--bg);color:var(--text);margin:10px 0}
#gate button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="badge"><img src="/static/logo.png" alt="Cutix PLC" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'CUTIX PLC'}))"></div>
    <div><h1>Cutix Assistant</h1><small>Demo built from public information</small></div>
  </header>
  <div class="note">Demo only, not an official Cutix service. Conversations may be reviewed to improve it.</div>
  <div id="msgs" aria-live="polite"></div>
  <div class="actions"><a id="wa" class="wa" target="_blank" rel="noopener">WhatsApp Cutix</a><a id="quote" target="_blank" rel="noopener">Request a quote</a></div>
  <form id="f"><textarea id="t" rows="1" maxlength="600" placeholder="Ask about Cutix cables…" aria-label="Your question"></textarea><button class="send" id="s" type="submit">Send</button></form>
  <div class="foot"><span id="left"></span> <span id="powered"></span></div>
</div>
<div id="gate"><div><b>Enter access code</b><input id="code" autocomplete="off"><button id="codeBtn">Continue</button><small id="codeErr" style="color:#d71920"></small></div></div>
<script>
const $=id=>document.getElementById(id);
let cfg={},history=[],busy=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let session=store.get('cutix_sid')||((window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());
store.set('cutix_sid',session);
let code=store.get('cutix_code')||'';
const chipsList=["What does Cutix make?","Where can I buy Cutix in Jos?","I need cables for my shop in Port Harcourt","What is HFFR cable?"];

function fmt(t){
  let s=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/([\w.+-]+@[\w-]+\.[\w.-]*\w)/g,'<a href="mailto:$1">$1</a>');
  s=s.replace(/(\+234[\s\d()]{9,}\d)/g,m=>'<a href="tel:+'+m.replace(/\D/g,'')+'">'+m+'</a>');
  let out='',inList=false;
  for(const ln of s.split('\n')){
    const m=ln.match(/^\s*[-•*]\s+(.*)$/);
    if(m){if(!inList){out+='<ul>';inList=true}out+='<li>'+m[1]+'</li>'}
    else{if(inList){out+='</ul>';inList=false}if(ln.trim())out+='<p>'+ln+'</p>'}
  }
  if(inList)out+='</ul>';return out;
}
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
function addBot(t){return add('bot',fmt(t))}
function typing(){return add('bot','<span class="typing"><i></i><i></i><i></i></span>')}

async function send(text){
  text=text.trim();if(!text||busy)return;
  document.querySelectorAll('.chips').forEach(c=>c.remove());
  add('me',fmt(text));busy=true;$('s').disabled=true;$('t').value='';
  const ty=typing();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,message:text,history:history.slice(-4),code})});
    const j=await r.json().catch(()=>({}));
    ty.remove();
    if(r.status===401){showGate('That code did not work.');addBot('Please enter the access code to continue.')}
    else if(!r.ok){addBot(j.error||'Sorry, something went wrong. Please try again.')}
    else{
      addBot(j.reply);history.push({role:'user',content:text},{role:'assistant',content:j.reply});
      if(typeof j.remaining==='number'&&j.remaining<=5)$('left').textContent=j.remaining+' message'+(j.remaining===1?'':'s')+' left in this demo. ';
      // Soft-hide: only promote WhatsApp button after a fully qualified lead (Need+Qty+Location)
      if(j.qualified && j.whatsapp_url){
        $('wa').href=j.whatsapp_url;
        $('wa').textContent='Continue on WhatsApp';
        $('wa').classList.add('ready');
      }
    }
  }catch(e){ty.remove();addBot('I could not reach the server. Please check your connection and try again.')}
  busy=false;$('s').disabled=false;$('t').focus();
}
function showGate(err){$('gate').style.display='flex';$('codeErr').textContent=err||'';$('code').focus()}
$('codeBtn').onclick=()=>{code=$('code').value.trim();store.set('cutix_code',code);$('gate').style.display='none'};
$('f').addEventListener('submit',e=>{e.preventDefault();send($('t').value)});
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('t').value)}});
$('t').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'});

(async function init(){
  try{cfg=await (await fetch('/config.json')).json()}catch(e){}
  $('wa').href=cfg.whatsapp||'#';$('quote').href=cfg.quoteUrl||'#';
  const em=cfg.contactEmail||'';const pb=(cfg.poweredBy||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  $('powered').innerHTML=(pb?pb+' · ':'')+(em?'Demo contact: <a href="mailto:'+em+'">'+em+'</a>':'');
  addBot("Hello! I can help with Cutix cables, finding where to buy, and getting a quote. What do you need?");
  const c=document.createElement('div');c.className='chips';
  chipsList.forEach(q=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=q;b.onclick=()=>send(q);c.appendChild(b)});
  $('msgs').appendChild(c);
  if(cfg.accessCodeRequired&&!code)showGate('');
})();
</script>
</body>
</html>
